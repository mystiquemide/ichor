name: ichor
version: "0.1.0"
description: "Catches the moments you correct Hermes and turns them into preference pairs you can train on. Local-first; nothing leaves your machine unless you share it."
author: "Mystique Mide"
license: MIT
homepage: https://github.com/mystiquemide/ichor
requires_hermes: ">=0.23.0"
provides_hooks:
  - post_llm_call
  - on_session_finalize
  - post_gateway_admission
capabilities:
  - llm.side_question
